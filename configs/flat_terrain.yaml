# Stage 1: Flat terrain — reference config (values are mirrored in code;
# this file documents the choices so you can tune/reproduce easily).

env:
  target_speed: 1.0          # m/s forward walking speed to track
  control_hz: 50              # policy decision frequency
  sim_dt: 0.002                # physics timestep (250 Hz internally)
  max_episode_seconds: 20.0
  action_scale: 0.5           # policy output -> radians offset from default pose
  domain_randomize: true      # light noise even on flat ground (recommended)

reward_weights:
  velocity_tracking: 1.5
  lateral_penalty: 1.0
  orientation_penalty: 1.0
  angular_velocity_penalty: 0.05
  torque_penalty: 0.0002
  action_rate_penalty: 0.01
  gait_bonus: 0.05
  alive_bonus: 0.5
  height_penalty: 2.0

ppo:
  learning_rate: 3.0e-4
  n_envs: 16
  batch_size: 4096
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  total_timesteps: 20_000_000
  net_arch_pi: [256, 256, 128]
  net_arch_vf: [256, 256, 128]

# Rough milestones to expect (varies by hardware/seed):
#   0 - 1M steps    : robot learns not to fall immediately, flails
#   1M - 5M steps   : discovers stable standing, starts shuffling forward
#   5M - 12M steps  : consistent quadrupedal gait (often a trot) emerges
#   12M - 20M steps : gait smooths out, better velocity tracking, robust to init noise
